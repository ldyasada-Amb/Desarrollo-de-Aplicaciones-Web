{% extends "base.html" %}

{% block title %}
Productos - Last Cine
{% endblock %}

{% block content %}

<h2 class="mb-4">Productos</h2>

<a href="#" class="btn btn-primary mb-3">
    Nuevo producto
</a>

<table class="table table-striped">

    <thead>
        <tr>
            <th>ID</th>
            <th>Producto</th>
            <th>Precio</th>
            <th>Stock</th>
        </tr>
    </thead>

    <tbody>

        {% for producto in productos %}

        <tr>
            <td>{{ producto.id }}</td>
            <td>{{ producto.nombre }}</td>
            <td>{{ producto.precio }}</td>
            <td>{{ producto.stock }}</td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
